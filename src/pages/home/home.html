@if (showTips) {
<div class="max-w-300 mx-auto px-4 mt-6 bg-amber-50 border border-amber-100 rounded-2xl p-6 shadow-sm">
  <div class="flex flex-col md:flex-row items-center justify-between gap-6">

      <div class="space-y-2">
        <h3 class="text-amber-700 font-bold text-lg flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Dicas
        </h3>
        <ul class="ml-4 text-amber-800 text-sm max-w-2xl leading-relaxed list-disc">
          <li>
            <p>Selecione o livro e as versões acima e clique na lupa para iniciar sua comparação.</p>
          </li>
          <li>
            <p><strong>clique em qualquer versículo</strong> para centralizá-lo em ambas as colunas.
          </li>
        </ul>
      </div>

      <div class="flex gap-4 shrink-0">
      <div class="flex flex-col items-center">
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-amber-600 text-white text-xs font-bold">1</span>
        <span class="text-[10px] mt-1 text-amber-900 font-medium uppercase tracking-tighter">Escolha</span>
      </div>
      <div class="h-px w-8 bg-amber-200 self-center mb-4"></div>
      <div class="flex flex-col items-center">
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-amber-600 text-white text-xs font-bold">2</span>
        <span class="text-[10px] mt-1 text-amber-900 font-medium uppercase tracking-tighter">Compare</span>
      </div>
      <div class="h-px w-8 bg-amber-200 self-center mb-4"></div>
      <div class="flex flex-col items-center">
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-amber-600 text-white text-xs font-bold">3</span>
        <span class="text-[10px] mt-1 text-amber-900 font-medium uppercase tracking-tighter">Foque</span>
      </div>
    </div>

  </div>
  <button
    (click)="showTips = false"
    class="mt-6 w-full md:w-auto px-6 py-2.5 text-sm font-bold text-amber-900 bg-amber-200/50 hover:bg-amber-200 border border-amber-300 rounded-xl transition-all duration-200 active:scale-95 cursor-pointer shadow-sm shadow-amber-200/50"
  >
    Entendi
  </button>
</div>
}

<div class="grid grid-cols-2 gap-4 py-4 mx-auto max-w-300">
  <ChapterView side="L" />
  <ChapterView side="R" />
</div>
