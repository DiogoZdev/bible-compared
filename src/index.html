<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bíblia Comparativa</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5edd8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('bible-compared-theme');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = storedTheme === 'dark' || ((storedTheme === 'system' || !storedTheme) && systemDark);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';

        var storedLanguage = localStorage.getItem('bible-compared-language');
        var language = storedLanguage === 'pt' || storedLanguage === 'en'
          ? storedLanguage
          : (navigator.language && navigator.language.toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en');
        document.documentElement.lang = language === 'pt' ? 'pt-BR' : 'en';
      } catch (error) {
        // Ignore storage/matchMedia failures and fall back to the defaults.
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
