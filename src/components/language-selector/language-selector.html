<div
  class="flex w-full items-center gap-0.5 rounded-lg border border-line bg-surface-muted p-0.5"
  role="group"
  [attr.aria-label]="i18n.t('language.select')"
>
  @for (option of options; track option.value) {
    <button
      type="button"
      (click)="setLanguage(option.value)"
      [class]="buttonClass(option.value)"
      [attr.aria-pressed]="i18n.language() === option.value"
      [attr.aria-label]="i18n.t(option.labelKey)"
      [title]="i18n.t(option.labelKey)"
    >
      {{ option.short }}
    </button>
  }
</div>
