<header class="sticky top-0 bg-surface border-b border-line z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row items-center justify-between py-3 md:py-4 gap-4">

      <div class="flex items-center gap-2 shrink-0">
        <div class="bg-brand p-1.5 rounded-lg shadow-sm shadow-brand/25">
          <svg class="w-5 h-5 text-brand-ink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
        </div>
        <h1 class="text-lg font-extrabold text-ink tracking-tight leading-none">
          Bíblia<span class="text-brand">Comparativa</span>
        </h1>
      </div>

      @if (showSelector) {
        <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">

          <div class="flex items-center bg-surface-muted p-1.5 rounded-xl border border-line w-full sm:w-auto justify-center">
            <select
              #bookSelect
              class="bg-transparent font-bold text-ink text-sm focus:outline-none cursor-pointer hover:text-brand transition-colors px-2"
              (change)="setBook(bookSelect.value)"
            >
              @for (book of books; track book.acr) {
                <option [value]="book.acr">{{book.name}}</option>
              }
            </select>

            <div class="w-px h-4 bg-line mx-1"></div>

            <select
              #chapterSelect
              (change)="setChapter(chapterSelect.value)"
              class="bg-transparent font-bold text-brand text-sm focus:outline-none cursor-pointer text-center px-2 min-w-[3rem]">
              @for (c of chapters; track c) {
                <option [value]="c">{{c}}</option>
              }
            </select>
          </div>

          <div class="flex items-center gap-2 bg-surface sm:bg-transparent w-full sm:w-auto justify-center">
            <div class="flex items-center gap-1.5 min-w-0">

              <select
                #versionLeft
                (change)="setVersionLeft(versionLeft.value)"
                class="max-w-30 md:max-w-37.5 bg-surface-muted border border-line text-ink-soft text-[11px] font-medium rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-brand truncate appearance-none"
              >
                @if (versions.length === 0) {
                  <option>Carregando versões...</option>
                }
                @for (version of versions; track version.id) {
                  <option [value]="version.id" [selected]="version.id === selectedVersionLeft"><strong>{{version.languageName}}</strong> - {{version.name}}</option>
                }
              </select>

              <span class="text-ink-muted text-[9px] font-black uppercase tracking-tighter shrink-0">VS</span>

              <select
                #versionRight
                (change)="setVersionRight(versionRight.value)"
                class="max-w-30 md:max-w-37.5 bg-surface-muted border border-line text-ink-soft text-[11px] font-medium rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-brand truncate appearance-none"
              >
                @if (versions.length === 0) {
                  <option>Carregando versões...</option>
                }
                @for (version of versions; track version.id) {
                  <option [value]="version.id" [selected]="version.id === selectedVersionRight"><strong>{{version.languageName}}</strong> - {{version.name}}</option>
                }
              </select>
            </div>

            <button
              (click)="loadDiff()"
              class="ml-1 p-2 text-ink-muted hover:text-brand hover:bg-brand-soft rounded-full transition-all shrink-0 cursor-pointer"
              aria-label="Comparar versões"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
            </button>
          </div>
        </div>
      }

      <div class="flex items-center gap-3">
        <ThemeSelector></ThemeSelector>

        <div class="h-4 w-px bg-line"></div>

        <div class="flex gap-4">
          <a href="/" class="text-ink-soft hover:text-brand text-xs transition-colors">
            Início
          </a>
          <div class="h-4 w-px bg-line"></div>
          <a href="/about" class="text-ink-soft hover:text-brand text-xs transition-colors">
            Sobre o Projeto
          </a>
        </div>
      </div>

    </div>
  </div>
</header>
