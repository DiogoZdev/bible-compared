<header class="sticky top-0 bg-white border-b border-gray-200 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row items-center justify-between py-3 md:py-4 gap-4">

      <div class="flex items-center gap-2 shrink-0">
        <div class="bg-indigo-600 p-1.5 rounded-lg shadow-sm shadow-indigo-200">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
        </div>
        <h1 class="text-lg font-extrabold text-gray-900 tracking-tight leading-none">
          Bíblia<span class="text-indigo-600">Comparativa</span>
        </h1>
      </div>

      @if (showSelector) {
        <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">

          <div class="flex items-center bg-gray-100/80 p-1.5 rounded-xl border border-gray-200 w-full sm:w-auto justify-center">
            <select
              #bookSelect
              class="bg-transparent font-bold text-gray-800 text-sm focus:outline-none cursor-pointer hover:text-indigo-600 transition-colors px-2"
              (change)="setBook(bookSelect.value)"
            >
              @for (book of books; track book.acr) {
                <option [value]="book.acr">{{book.name}}</option>
              }
            </select>

            <div class="w-px h-4 bg-gray-300 mx-1"></div>

            <select
              #chapterSelect
              class="bg-transparent font-bold text-indigo-600 text-sm focus:outline-none cursor-pointer text-center px-2 min-w-[3rem]">
              @for (c of chapters; track c) {
                <option [value]="c">{{c}}</option>
              }
            </select>
          </div>

          <div class="flex items-center gap-2 bg-white sm:bg-transparent w-full sm:w-auto justify-center">
            <div class="flex items-center gap-1.5 min-w-0">

              <select
                #versionLeft
                (change)="setVersionLeft(versionLeft.value)"
                class="max-w-30 md:max-w-37.5 bg-gray-50 border border-gray-300 text-gray-700 text-[11px] font-medium rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-indigo-500 truncate appearance-none"
              >
                @if (versions.length === 0) {
                  <option>Carregando versões...</option>
                }
                @for (version of versions; track version.id) {
                  <option [value]="version.id"><strong>{{version.languageName}}</strong> - {{version.name}}</option>
                }
              </select>

              <span class="text-gray-400 text-[9px] font-black uppercase tracking-tighter shrink-0">VS</span>

              <select
                #versionRight
                (change)="setVersionRight(versionRight.value)"
                class="max-w-30 md:max-w-37.5 bg-gray-50 border border-gray-300 text-gray-700 text-[11px] font-medium rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-indigo-500 truncate appearance-none"
              >
                @if (versions.length === 0) {
                  <option>Carregando versões...</option>
                }
                @for (version of versions; track version.id) {
                  <option [value]="version.id"><strong>{{version.languageName}}</strong> - {{version.name}}</option>
                }
              </select>
            </div>

            <button
              (click)="loadDiff()"
              class="ml-1 p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-all shrink-0 cursor-pointer"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
            </button>
          </div>
        </div>
      }

      <div class="flex gap-4">
        <a href="/" class="text-gray-500 hover:text-blue-600 text-xs transition-colors">
          Início
        </a>
        <div class="h-4 w-px bg-gray-300"></div>
        <a href="/about" class="text-gray-500 hover:text-blue-600 text-xs transition-colors">
          Sobre o Projeto
        </a>
      </div>

    </div>
  </div>
</header>
