<div
  [attr.dir]="languageCode === 'heb' ? 'rtl' : 'ltr'"
  class="flex flex-col max-h-[70vh] bg-surface border border-line rounded-xl shadow-sm transition-all overflow-hidden"
>

  <div dir="ltr" class="flex items-center justify-between px-5 py-3 bg-surface-muted border-b border-line">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-brand"></span>
      <h2 class="text-xs font-bold text-ink-soft uppercase tracking-widest">
        {{ versionTitle }}
      </h2>
    </div>
    <span class="px-2 py-0.5 text-[10px] font-bold bg-brand-soft text-brand rounded uppercase">
      {{ languageCode }}
    </span>
  </div>

  <div class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth custom-scrollbar">
    @for (v of verses; track v.number) {
      <div class="relative group cursor-default transition-all duration-200 hover:bg-surface-muted -mx-2 px-2 rounded-lg">

        <span
          [class]="languageCode === 'heb' ? '-right-1' : '-left-1'"
          class="absolute top-1.5 text-[10px] font-mono font-bold text-ink-muted group-hover:text-brand transition-colors"
        >
          {{ v.number }}
        </span>

        <p
          [id]="'v-' + languageCode + '-' + v.number"
          (click)="onVerseClick(v.number)"
          [class.text-2xl]="languageCode === 'heb'"
          class="ps-6 text-ink text-xl leading-relaxed font-serif tracking-wide text-start cursor-pointer transition-all duration-200"
        >
          {{ v.text }}
        </p>
      </div>
    }
  </div>
</div>
