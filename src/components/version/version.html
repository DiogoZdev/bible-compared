<div class="flex flex-col h-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm transition-all overflow-hidden">

  <div class="flex items-center justify-between px-5 py-3 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-800">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
      <h2 class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest">
        {{ versionTitle }}
      </h2>
    </div>
    <span class="px-2 py-0.5 text-[10px] font-bold bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-400 rounded uppercase">
      {{ languageCode }}
    </span>
  </div>

  <div class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth custom-scrollbar">
    <div *ngFor="let v of verses"
         class="relative group cursor-default transition-all duration-200 hover:bg-slate-50 dark:hover:bg-slate-800/40 -mx-2 px-2 rounded-lg">

      <span class="absolute -left-1 top-1.5 text-[10px] font-mono font-bold text-slate-400 group-hover:text-indigo-600 transition-colors">
        {{ v.number }}
      </span>

      <p class="pl-6 text-slate-800 dark:text-slate-200 text-lg leading-relaxed font-serif tracking-wide">
        {{ v.text }}
      </p>
    </div>
  </div>
</div>
