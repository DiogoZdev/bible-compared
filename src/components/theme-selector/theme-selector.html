<div
  class="flex w-full items-center gap-0.5 rounded-lg border border-line bg-surface-muted p-0.5"
  role="group"
  [attr.aria-label]="i18n.t('theme.select')"
>
  @for (option of options; track option.value) {
    <button
      type="button"
      (click)="setTheme(option.value)"
      [class]="buttonClass(option.value)"
      [attr.aria-pressed]="themeService.theme() === option.value"
      [attr.aria-label]="i18n.t(option.labelKey)"
      [title]="i18n.t(option.labelKey)"
    >
      @switch (option.value) {
        @case ('light') {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
        }
        @case ('dark') {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        }
        @case ('system') {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
            />
          </svg>
        }
      }
    </button>
  }
</div>
